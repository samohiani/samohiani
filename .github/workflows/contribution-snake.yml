name: Refresh contribution snake

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main, feat/contribution-snake]
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate Nord contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#ebcb8b&color_dots=#e5e9f0,#a3be8c,#88c0d0,#81a1c1,#5e81ac
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#ebcb8b&color_dots=#3b4252,#5e81ac,#81a1c1,#88c0d0,#a3be8c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed animations
        run: |
          test -s assets/contribution-snake.svg
          test -s assets/contribution-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already current."
            exit 0
          fi
          git commit -m "Refresh contribution snake animations"
          git push
